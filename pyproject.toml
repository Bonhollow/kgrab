[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kgrab"
version = "0.1.2"
description = "Scrape framework/package documentation and generate an AGENTS.md knowledge file."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "mcp[cli]>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "responses>=0.23",
]

[project.scripts]
doc-scrape = "doc_scraper.cli:main"
doc-scrape-mcp = "doc_scraper.mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
